name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore WorkSamples.slnx

      - name: Build solution
        run: dotnet build WorkSamples.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test WorkSamples.slnx --no-build --configuration Release